<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enclosed Trailer Configurator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ui:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --acc:#1d5fb4; --ink:#1d2733; --muted:#5d6b7b; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { font-family:var(--ui); background:#e9edf2; color:var(--ink); display:flex; flex-direction:column; min-height:100vh; }
  header { background:#0f1d2e; color:#fff; padding:16px 22px; }
  header h1 { font-size:21px; margin:0; font-weight:700; }
  header .sub { font-size:12px; color:#9fb2c8; margin-top:4px; }
  main { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:28px 16px 40px; }
  .card { background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.12); width:100%; max-width:420px; padding:22px 20px 20px; }
  .card h2 { margin:0 0 6px; font-size:15px; letter-spacing:.4px; text-transform:uppercase; color:#2b3a4b; }
  .hint { margin:0 0 16px; font-size:13px; color:var(--muted); line-height:1.4; }
  label { display:block; font-weight:600; font-size:13px; color:#3b4a5b; margin-bottom:6px; }
  .pw-row { display:flex; gap:8px; align-items:stretch; margin-bottom:12px; }
  #gate-password { flex:1; font:16px var(--ui); padding:10px 12px; border:1px solid #c3ccd6; border-radius:8px; background:#f8fafc; color:var(--ink); min-height:48px; width:100%; }
  #gate-password:focus { outline:2px solid var(--acc); outline-offset:1px; border-color:var(--acc); }
  #gate-toggle { font:600 13px var(--ui); padding:0 12px; border:1px solid #c3ccd6; border-radius:8px; background:#f1f4f7; color:#1d2733; cursor:pointer; min-height:48px; min-width:72px; }
  .chk { display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; color:#3b4a5b; margin:0 0 14px; min-height:40px; cursor:pointer; }
  .chk input { width:20px; height:20px; flex:0 0 20px; }
  #gate-unlock { width:100%; font:700 15px var(--ui); padding:12px; border:0; border-radius:8px; background:#0f1d2e; color:#fff; cursor:pointer; min-height:48px; }
  #gate-unlock:disabled { opacity:.65; cursor:wait; }
  #gate-err { margin:12px 0 0; font-size:13px; color:#c62828; }
  #gate-err[hidden] { display:none; }
  footer { text-align:center; font-size:11px; opacity:.6; padding:10px 8px 14px; }
  noscript { display:block; margin:12px 16px; color:#c62828; text-align:center; }
  @media (max-width:640px) {
    header { padding:12px 14px; }
    header h1 { font-size:18px; }
    main { padding:16px 10px 28px; }
    .card { padding:18px 14px 16px; }
    .chk input { width:22px; height:22px; flex-basis:22px; }
  }
</style>
</head>
<body>
<header>
  <h1>Enclosed Trailer Configurator</h1>
  <div class="sub">Password required to open this build</div>
</header>
<noscript>This page needs JavaScript to unlock.</noscript>
<main>
  <div class="card">
    <h2>Unlock</h2>
    <p class="hint">Enter the password to open the configurator on this device.</p>
    <form id="gate-form" autocomplete="off">
      <label for="gate-password">Password</label>
      <div class="pw-row">
        <input id="gate-password" name="password" type="password" autocomplete="current-password" required aria-required="true" aria-describedby="gate-err">
        <button type="button" id="gate-toggle" aria-pressed="false" aria-label="Show password">Show</button>
      </div>
      <label class="chk"><input type="checkbox" id="gate-remember"> Remember on this device</label>
      <button type="submit" id="gate-unlock">Unlock</button>
      <p id="gate-err" role="alert" hidden></p>
    </form>
  </div>
</main>

const STORE = "trailerConfigGate";
const FAIL_MS = 600;

function b64ToBytes(s){
  const bin = atob(s);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function bytesToB64(buf){
  const u = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
  return btoa(s);
}
function setError(msg){
  const el = document.getElementById("gate-err");
  if (!el) return;
  el.textContent = msg || "";
  el.hidden = !msg;
}
function setBusy(on){
  const btn = document.getElementById("gate-unlock");
  const pw = document.getElementById("gate-password");
  if (btn){ btn.disabled = !!on; btn.textContent = on ? "Unlocking…" : "Unlock"; }
  if (pw) pw.disabled = !!on;
}
async function deriveKey(password, salt, iter, extractable){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:salt, iterations:iter, hash:"SHA-256" },
    base,
    { name:"AES-GCM", length:256 },
    !!extractable,
    ["decrypt"]
  );
}
async function decryptWithKey(key){
  const iv = b64ToBytes(PAYLOAD.iv);
  const ct = b64ToBytes(PAYLOAD.ct);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:iv }, key, ct);
  return new TextDecoder().decode(pt);
}
function injectLock(html){
  const link = ' \u00b7 <a href="#lock" id="gate-lock" style="color:inherit;text-decoration:underline">Lock</a>';
  let out = String(html);
  const foot = "</footer>";
  const i = out.lastIndexOf(foot);
  if (i !== -1) out = out.slice(0, i) + link + out.slice(i);
  const boot = '<script>(function(){var a=document.getElementById("gate-lock");if(!a)return;a.addEventListener("click",function(e){e.preventDefault();try{localStorage.removeItem("'+STORE+'");}catch(x){}location.reload();});})();<\/script>';
  const b = out.lastIndexOf("</body>");
  if (b !== -1) out = out.slice(0, b) + boot + out.slice(b);
  else out += boot;
  return out;
}
function openPage(html){
  const next = injectLock(html);
  document.open();
  document.write(next);
  document.close();
}
async function rememberKey(key){
  try {
    const raw = await crypto.subtle.exportKey("raw", key);
    localStorage.setItem(STORE, JSON.stringify({ v:PAYLOAD.v, salt:PAYLOAD.salt, key:bytesToB64(raw) }));
  } catch (e) { /* storage may be blocked; unlock still proceeds */ }
}
async function tryRemembered(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return false;
    const rec = JSON.parse(raw);
    if (!rec || rec.salt !== PAYLOAD.salt || !rec.key) { localStorage.removeItem(STORE); return false; }
    const key = await crypto.subtle.importKey("raw", b64ToBytes(rec.key), { name:"AES-GCM" }, false, ["decrypt"]);
    const html = await decryptWithKey(key);
    openPage(html);
    return true;
  } catch (e) {
    try { localStorage.removeItem(STORE); } catch (x) {}
    return false;
  }
}
async function unlock(password, remember){
  if (!window.crypto || !crypto.subtle) throw new Error("browser");
  const salt = b64ToBytes(PAYLOAD.salt);
  const key = await deriveKey(password, salt, PAYLOAD.iter, !!remember);
  const html = await decryptWithKey(key);
  if (remember) await rememberKey(key);
  else { try { localStorage.removeItem(STORE); } catch (e) {} }
  openPage(html);
}
function delay(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

document.getElementById("gate-toggle").addEventListener("click", function(){
  const pw = document.getElementById("gate-password");
  const btn = document.getElementById("gate-toggle");
  const show = pw.type === "password";
  pw.type = show ? "text" : "password";
  btn.setAttribute("aria-pressed", show ? "true" : "false");
  btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
  btn.textContent = show ? "Hide" : "Show";
});
document.getElementById("gate-form").addEventListener("submit", async function(e){
  e.preventDefault();
  const pw = document.getElementById("gate-password");
  const remember = document.getElementById("gate-remember").checked;
  const value = (pw.value || "");
  setError("");
  if (!value){ setError("Enter a password."); pw.focus(); return; }
  setBusy(true);
  try {
    await unlock(value, remember);
  } catch (err) {
    await delay(FAIL_MS);
    setBusy(false);
    setError("Incorrect password");
    pw.focus();
    pw.select();
  }
});
(function init(){
  if (!window.crypto || !crypto.subtle){
    setError("This page needs a current browser to unlock.");
    return;
  }
  tryRemembered();
})();
</script>
